<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Explanet Social Live Wall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F3EF; --panel:#F3F3EF; --card:#FFFFFF; --border:#DCDCD6;
    --ink:#1E1E1E; --muted:#6E6E6B; --green:#2BAB61;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden;
  }
  .layout{display:grid; grid-template-columns:360px 1fr; height:100vh;}
  .sidebar{
    background:var(--panel); border-right:2px solid var(--border);
    padding:32px 28px; display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-icon{width:64px; height:64px; display:block; flex:0 0 auto;}
  .brand-word{display:flex; flex-direction:column; line-height:1.05; font-weight:700; font-size:1.5rem; text-align:left;}
  .brand-word .w1{color:var(--green);}
  .brand-word .w2{color:var(--ink);}
  .kicker{
    font-weight:600; letter-spacing:.3em; text-transform:uppercase;
    color:var(--green); font-size:.85rem; margin-top:14px;
  }
  .join-qr{background:#fff; padding:16px; box-shadow:8px 8px 0 rgba(0,0,0,.55);}
  .join-qr svg{display:block; width:220px; height:220px;}
  .how-it-works-wrap{margin:auto 0; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;}
  .how-it-works-title{font-weight:700; color:var(--ink); font-size:1.4rem;}
  .how-it-works{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:16px; text-align:center; width:100%;}
  .how-it-works li{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .how-it-works .step-num{font-weight:700; color:var(--green); font-size:.9rem; letter-spacing:.03em; flex:0 0 auto;}
  .how-it-works .step-text{color:var(--ink); font-size:1rem; font-weight:400; line-height:1.3;}
  .counter{padding-top:24px; border-top:2px solid var(--border); width:100%;}
  .counter .num{font-size:2.8rem; font-weight:700; color:var(--green); line-height:1;}
  .counter .lbl{color:var(--muted); font-size:.95rem; margin-top:4px;}
  .wall{padding:28px 32px; overflow:hidden; position:relative; display:flex; flex-direction:column; height:100vh; background:var(--ink);}
  .wall-header{display:flex; align-items:baseline; justify-content:flex-end; margin-bottom:20px; flex:0 0 auto;}
  .wall-header .page-dots{display:flex; gap:6px;}
  .page-dots span{width:8px; height:8px; border-radius:50%; background:var(--border);}
  .page-dots span.active{background:var(--green);}
  .grid{
    flex:1; min-height:0; display:flex; flex-wrap:wrap;
    justify-content:center; align-content:center; align-items:center;
    gap:18px; overflow:hidden;
  }
  .empty-state{margin:auto; color:var(--muted); font-size:1.3rem; text-align:center;}
  .card{
    width:var(--card-w, 190px); flex:0 0 auto;
    background:var(--card); border:1px solid var(--border);
    padding:14px; display:flex; flex-direction:column; align-items:center; gap:10px;
    animation:enter .5s ease-out; box-shadow:8px 8px 0 rgba(0,0,0,.55);
  }
  .card svg{background:#fff; padding:6px; width:100%; height:auto; box-sizing:border-box; display:block;}
  .card .info{width:100%; display:flex; flex-direction:column; gap:3px;}
  .card .name{font-weight:600; font-size:calc(var(--card-w, 190px) * 0.1); text-align:center; line-height:1.25; color:var(--ink); width:100%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .role{font-weight:500; font-size:calc(var(--card-w, 190px) * 0.072); text-align:center; line-height:1.2; color:var(--muted); width:100%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  @keyframes enter{
    from{opacity:0; transform:translateY(14px) scale(.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
</style>
</head>
<body>

<div class="layout">
  <div class="sidebar">
    <div class="brand">
      <img class="brand-icon" src="images/logo-icon.svg" alt="">
      <div class="brand-word"><span class="w1">Explanet</span><span class="w2">House</span></div>
    </div>
    <div class="kicker">Social Live Wall</div>
    <div class="join-qr" id="joinQr"></div>
    <div class="how-it-works-wrap">
    <div class="how-it-works-title">How it works</div>
    <ol class="how-it-works">
      <li><span class="step-num">01</span><span class="step-text">Scan the QR code above</span></li>
      <li><span class="step-num">02</span><span class="step-text">Add your name &amp; LinkedIn URL in the form</span></li>
      <li><span class="step-num">03</span><span class="step-text">You're on the wall</span></li>
      <li><span class="step-num">04</span><span class="step-text">Connect with others by scanning the QRs</span></li>
    </ol>
    </div>
    <div class="counter">
      <div class="num" id="countNum">0</div>
      <div class="lbl">People on the wall</div>
    </div>
  </div>
  <div class="wall">
    <div class="wall-header">
      <div class="page-dots" id="pageDots"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script src="qrcode.js"></script>
<script>
// ---- CONFIGURE THESE THREE VALUES ----
const CONFIG = {
  FORM_URL: 'https://docs.google.com/forms/d/e/1FAIpQLSfxavkaLY8j79Mgqkx37cDqjA6y1omY6wCurtwaZLDy4jG2GQ/viewform',
  SHEET_ID: '1md2MeRdCPJAr9ewLPPWPCBzvr9Tap8V78JWotKKMF7s',
  SHEET_GID: '1405262916',
};
const POLL_INTERVAL_MS = 4000;
const CARDS_PER_PAGE = 24;
const PAGE_ROTATE_MS = 9000;

function svgQr(text, cellSize){
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize, margin: 2, scalable: true });
}

document.getElementById('joinQr').innerHTML = svgQr(CONFIG.FORM_URL, 6);

let entries = [];      // {key, name, linkedin}
let seenKeys = new Set();
let page = 0;

function gvizUrl(callbackName){
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callbackName}&gid=${CONFIG.SHEET_GID}&headers=1&_=${Date.now()}`;
}

function fetchJsonp(){
  return new Promise((resolve, reject) => {
    const callbackName = 'gvizCallback_' + Date.now();
    const script = document.createElement('script');
    const cleanup = () => { delete window[callbackName]; script.remove(); };
    window[callbackName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP request failed')); };
    script.src = gvizUrl(callbackName);
    document.body.appendChild(script);
  });
}

function findCol(cols, matches){
  return cols.findIndex(c => {
    const label = (c.label || '').toLowerCase();
    return matches.some(m => label.includes(m));
  });
}

function normalizeLinkedInUrl(raw){
  if (!raw) return null;
  let url = raw.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

async function poll(){
  try{
    const data = await fetchJsonp();
    const cols = data.table.cols;
    const rows = data.table.rows;

    const nameIdx = findCol(cols, ['name']);
    const linkedinIdx = findCol(cols, ['linkedin']);
    const roleIdx = findCol(cols, ['what do you do', 'role', 'title', 'job', 'description']);
    if (nameIdx === -1 || linkedinIdx === -1) return;

    const fresh = [];
    rows.forEach((row, i) => {
      const nameCell = row.c[nameIdx];
      const liCell = row.c[linkedinIdx];
      const roleCell = roleIdx === -1 ? null : row.c[roleIdx];
      const name = nameCell && nameCell.v ? String(nameCell.v).trim() : '';
      const linkedin = normalizeLinkedInUrl(liCell && liCell.v ? String(liCell.v) : '');
      const role = roleCell && roleCell.v ? String(roleCell.v).trim() : '';
      if (!name || !linkedin) return;
      const key = i + '|' + name + '|' + linkedin;
      fresh.push({ key, name, linkedin, role });
    });

    const newOnes = fresh.filter(e => !seenKeys.has(e.key));
    if (newOnes.length === 0 && fresh.length === entries.length) return;

    newOnes.forEach(e => seenKeys.add(e.key));
    entries = fresh;
    render(newOnes.map(e => e.key));
  } catch(err){
    console.error('poll failed', err);
  }
}

const MIN_CARD_W = 130;
const MAX_CARD_W = 340;
const CARD_ASPECT = 1.55;
const GRID_GAP = 18;

function computeCardWidth(n, containerW, containerH){
  if (n <= 0) return MAX_CARD_W;
  let best = MIN_CARD_W;
  for (let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const wFromWidth = (containerW - GRID_GAP * (cols - 1)) / cols;
    const wFromHeight = ((containerH - GRID_GAP * (rows - 1)) / rows) / CARD_ASPECT;
    const w = Math.min(wFromWidth, wFromHeight);
    if (w > best) best = w;
  }
  return Math.max(MIN_CARD_W, Math.min(MAX_CARD_W, best * 0.97));
}

function render(newKeys){
  const grid = document.getElementById('grid');
  document.getElementById('countNum').textContent = entries.length;

  if (entries.length === 0){
    grid.innerHTML = '<div class="empty-state">Waiting for the first person to join…</div>';
    updateDots(0);
    return;
  }

  const totalPages = Math.max(1, Math.ceil(entries.length / CARDS_PER_PAGE));
  if (page >= totalPages) page = totalPages - 1;
  const start = page * CARDS_PER_PAGE;
  const pageItems = entries.slice(start, start + CARDS_PER_PAGE);

  const rect = grid.getBoundingClientRect();
  const cardW = computeCardWidth(pageItems.length, rect.width, rect.height);
  grid.style.setProperty('--card-w', cardW + 'px');

  grid.innerHTML = '';
  pageItems.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card' + (newKeys.includes(e.key) ? ' new' : '');
    const roleHtml = e.role ? `<div class="role">${escapeHtml(e.role)}</div>` : '';
    card.innerHTML = svgQr(e.linkedin, 4) + `<div class="info"><div class="name">${escapeHtml(e.name)}</div>${roleHtml}</div>`;
    grid.appendChild(card);
  });

  updateDots(totalPages);
}

function updateDots(totalPages){
  const dots = document.getElementById('pageDots');
  dots.innerHTML = '';
  if (totalPages <= 1) return;
  for (let i = 0; i < totalPages; i++){
    const d = document.createElement('span');
    if (i === page) d.className = 'active';
    dots.appendChild(d);
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

setInterval(() => {
  const totalPages = Math.max(1, Math.ceil(entries.length / CARDS_PER_PAGE));
  if (totalPages > 1){
    page = (page + 1) % totalPages;
    render([]);
  }
}, PAGE_ROTATE_MS);

window.addEventListener('resize', () => render([]));

poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
